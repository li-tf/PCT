<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <rect width="1500" height="760" fill="white"/>
  <defs>
    <marker id="rotationArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b4fa3"/></marker>
    <marker id="axisArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
  </defs>
  <text x="750" y="44" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">Compact 3-D multi-material pCT pilot</text>
  <text x="750" y="76" text-anchor="middle" font-family="Arial" font-size="17" fill="#475467">360 projections around the scanner y axis</text>
  <g transform="translate(40,110)">
    <text x="330" y="0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">x-z plane: view from +y toward -y</text>
    <polygon points="30,260 650,160 650,360" fill="#eaf2fa" stroke="#7aa6c2" stroke-width="2"/>
    <circle cx="410" cy="260" r="145" fill="#b9def1" stroke="#2878a4" stroke-width="4"/>
    <circle cx="410" cy="260" r="15" fill="white" stroke="#475467" stroke-width="2"/>
    <circle cx="338" cy="225" r="9" fill="#f5bd34" stroke="#7a5400" stroke-width="2"/>
    <circle cx="474" cy="208" r="15" fill="#d9c2a6" stroke="#7a5b35" stroke-width="2"/>
    <circle cx="352" cy="324" r="21" fill="#a6c8a1" stroke="#477044" stroke-width="2"/>
    <circle cx="474" cy="318" r="18" fill="#ef9b83" stroke="#93452f" stroke-width="2"/>
    <line x1="260" y1="95" x2="260" y2="425" stroke="#344054" stroke-width="4" stroke-dasharray="9 7"/>
    <line x1="590" y1="95" x2="590" y2="425" stroke="#344054" stroke-width="4" stroke-dasharray="9 7"/>
    <circle cx="30" cy="260" r="9" fill="#c8553d"/>
    <text x="30" y="235" text-anchor="middle" font-family="Arial" font-size="16">source -560</text>
    <text x="260" y="454" text-anchor="middle" font-family="Arial" font-size="16">In -60</text>
    <text x="590" y="454" text-anchor="middle" font-family="Arial" font-size="16">Out +60</text>
    <text x="410" y="485" text-anchor="middle" font-family="Arial" font-size="16">water radius 50 mm</text>
    <path d="M300 130 A175 175 0 0 1 535 145" fill="none" stroke="#7b4fa3" stroke-width="5" marker-end="url(#rotationArrow)"/>
    <text x="420" y="93" text-anchor="middle" font-family="Arial" font-size="17" fill="#7b4fa3">rotation about y</text>
    <line x1="90" y1="410" x2="180" y2="410" stroke="#344054" stroke-width="3" marker-end="url(#axisArrow)"/>
    <line x1="90" y1="410" x2="90" y2="325" stroke="#344054" stroke-width="3" marker-end="url(#axisArrow)"/>
    <text x="190" y="416" font-family="Arial" font-size="18" font-weight="bold">+z</text>
    <text x="77" y="316" font-family="Arial" font-size="18" font-weight="bold">+x</text>
    <circle cx="90" cy="455" r="11" fill="white" stroke="#344054" stroke-width="2"/>
    <circle cx="90" cy="455" r="3.5" fill="#344054"/>
    <text x="110" y="461" font-family="Arial" font-size="16">+y points toward viewer</text>
  </g>
  <g transform="translate(770,110)">
    <text x="330" y="0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">x-y plane: view from +z toward -z</text>
    <rect x="90" y="145" width="500" height="230" rx="18" fill="#b9def1" stroke="#2878a4" stroke-width="4"/>
    <circle cx="340" cy="260" r="25" fill="white" stroke="#475467" stroke-width="2"/>
    <circle cx="215" cy="314" r="15" fill="#f5bd34" stroke="#7a5400" stroke-width="2"/>
    <circle cx="450" cy="206" r="25" fill="#d9c2a6" stroke="#7a5b35" stroke-width="2"/>
    <circle cx="240" cy="206" r="35" fill="#a6c8a1" stroke="#477044" stroke-width="2"/>
    <circle cx="450" cy="314" r="30" fill="#ef9b83" stroke="#93452f" stroke-width="2"/>
    <line x1="80" y1="260" x2="600" y2="260" stroke="#667085" stroke-width="2"/>
    <text x="340" y="410" text-anchor="middle" font-family="Arial" font-size="17">30 mm axial water length; spheres at y = -7, 0, +7 mm</text>
    <line x1="105" y1="465" x2="195" y2="465" stroke="#344054" stroke-width="3" marker-end="url(#axisArrow)"/>
    <line x1="105" y1="465" x2="105" y2="390" stroke="#344054" stroke-width="3" marker-end="url(#axisArrow)"/>
    <text x="205" y="471" font-family="Arial" font-size="18" font-weight="bold">+x</text>
    <text x="91" y="382" font-family="Arial" font-size="18" font-weight="bold">+y</text>
    <circle cx="390" cy="465" r="11" fill="white" stroke="#344054" stroke-width="2"/>
    <circle cx="390" cy="465" r="3.5" fill="#344054"/>
    <text x="410" y="471" font-family="Arial" font-size="16">+z points toward viewer</text>
  </g>
  <g transform="translate(225,665)" font-family="Arial" font-size="17">
    <rect x="-145" y="-10" width="20" height="20" fill="#b9def1" stroke="#2878a4" stroke-width="2"/><text x="-115" y="6">Water</text>
    <circle cx="0" cy="0" r="10" fill="white" stroke="#475467" stroke-width="2"/><text x="18" y="6">Air</text>
    <circle cx="150" cy="0" r="10" fill="#f5bd34"/><text x="168" y="6">Aluminium</text>
    <circle cx="340" cy="0" r="10" fill="#d9c2a6"/><text x="358" y="6">SpineBone</text>
    <circle cx="550" cy="0" r="10" fill="#a6c8a1"/><text x="568" y="6">Lung</text>
    <circle cx="700" cy="0" r="10" fill="#ef9b83"/><text x="718" y="6">A150 tissue plastic</text>
  </g>
  <text x="750" y="730" text-anchor="middle" font-family="Arial" font-size="18" fill="#475467">Recommended reconstruction: 120 x 40 x 120 mm at 0.5 mm (240 x 80 x 240 voxels)</text>
</svg>
